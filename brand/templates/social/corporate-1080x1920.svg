<!-- Fiper social master — Fiper Brand Identity System v2.2.0 (approved composition). Corporate announcement (story): statement-led, lockup top-start, one headline block at the optical centre, meta column at the foot.
     Editable <text>; fonts by family name: install brand/fonts/*.woff2. Safe margin = 2× lockup height: posts 72–84 px, story 96 px (Q8). The fixed risk line «الاستثمار ينطوي على مخاطر · Investing involves risk» sits ON the image — small, muted, inside the bottom safe area — and in the caption too (Q4, CEO decision 30 Oct 2026); the full regulatory block stays in the caption, never on the image. Logo = the official master inlined (never recoloured). Arabic letter-spacing 0, font-synthesis none. Body text ≥ 42 px (≥ 14 px when shown at 360 wide). -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1920" viewBox="0 0 1080 1920">
