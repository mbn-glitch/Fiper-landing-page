  <text id="headline" direction="rtl" text-anchor="start" font-family="IBM Plex Sans Arabic" font-weight="700" font-size="76" fill="#120D0E" letter-spacing="0"><tspan x="984" y="800">فايبر جلوبال تعلن</tspan><tspan x="984" dy="96">إدراج صناديق جديدة</tspan><tspan x="984" dy="96">متوافقة مع الشريعة</tspan></text>
